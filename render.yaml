services:
  - type: web
    name: nexus-ai-backend
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node server.mjs
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
